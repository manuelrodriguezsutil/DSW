<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de un formulario y manejo de datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <style>
        .container {
            padding: 50px;
        }
    </style>

</head>

<body>

    <div class="container">
        <p class="h1">[PHP] Creación de un formulario y manejo de datos</p>

        <br />

        <form method="post" action="procesar.php">
            <label for="nombre" class="form-label">Nombre</label>
            <input name="nombre" type="text" id="nombre" class="form-control" aria-describedby="nombreHelpBlock"
                placeholder="Nombre">
            <div id="nombreHelpBlock" class="form-text">
                Introduce tu nombre
            </div>

            <br />

            <label for="edad" class="form-label">Edad</label>
            <input name="edad" min="0" max="110" type="number" id="edad" class="form-control"
                aria-describedby="edadHelpBlock">
            <div id="edadHelpBlock" class="form-text">
                Introduce tu edad
            </div>

            <br />

            <label for="email" class="form-label">Correo Electrónico</label>
            <input name="email" type="email" id="email" class="form-control" aria-describedby="emailHelpBlock"
                placeholder="ejemplo@correo.com">
            <div id="emailHelpBlock" class="form-text">
                Introduce tu correo electrónico
            </div>

            <br />

            <input class="btn-solid theme-primary" type="submit" value="Enviar" />
        </form>
    </div>

</body>

</html>
